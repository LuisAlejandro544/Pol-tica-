# Propósito del archivo:
# GitHub Action EXCLUSIVAMENTE MANUAL (`workflow_dispatch`) para generar el mapa 3D
# de Latinoamérica en Blender (.glb) y el catálogo de provincias/capitales en Lua 5.4.
# Opcionalmente permite subir ambos archivos como un GitHub Release con versión propia
# (si no se activa, ese paso se omite). Nunca se ejecuta en pushes ni pull requests.

name: Generar Mapa 3D Blender (Manual)

on:
  workflow_dispatch:
    inputs:
      simplify_tolerance:
        description: "Tolerancia de simplificación GeoJSON en grados (menor = más detalle)"
        required: true
        default: "0.05"
        type: string
      commit_assets:
        description: "¿Forzar commit al repositorio? (No recomendado si está en .gitignore)"
        required: true
        default: false
        type: boolean
      publish_release:
        description: "¿Publicar latinoamerica_3d.glb y provinces_latam.lua en un GitHub Release?"
        required: true
        default: false
        type: boolean
      release_version:
        description: "Versión/Tag del Release (ej. map-v0.1.0, usado solo si activas Release)"
        required: false
        default: "map-v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-blender-map:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Lua 5.4 y utilidades base
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 curl xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0

      - name: Caché de Blender 4.3.2
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/.local/share/blender
          key: blender-linux-x64-4.3.2

      - name: Instalar Blender 4.3 LTS (headless)
        run: |
          BLENDER_VER="4.3.2"
          BLENDER_ROOT="$HOME/.local/share/blender"
          BLENDER_DIR="$BLENDER_ROOT/blender-${BLENDER_VER}-linux-x64"
          mkdir -p "$BLENDER_ROOT"
          if [ ! -x "$BLENDER_DIR/blender" ]; then
            URLS=(
              "https://mirror.clarkson.edu/blender/release/Blender4.3/blender-${BLENDER_VER}-linux-x64.tar.xz"
              "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VER}-linux-x64.tar.xz"
            )
            DOWNLOADED=0
            for url in "${URLS[@]}"; do
              echo "Intentando descargar Blender desde: $url"
              if curl -fSL --retry 3 --retry-delay 5 -A "Mozilla/5.0" "$url" -o /tmp/blender.tar.xz; then
                if xz -t /tmp/blender.tar.xz; then
                  DOWNLOADED=1
                  break
                fi
              fi
              rm -f /tmp/blender.tar.xz
            done
            if [ "$DOWNLOADED" -ne 1 ]; then
              echo "No se pudo descargar un paquete .tar.xz válido de Blender" >&2
              exit 1
            fi
            tar -xf /tmp/blender.tar.xz -C "$BLENDER_ROOT"
            rm -f /tmp/blender.tar.xz
          fi
          sudo ln -sf "$BLENDER_DIR/blender" /usr/local/bin/blender
          blender --version

      - name: Paso Lua 5.4 — Exportar metadatos y colores desde countries_latam.lua
        run: |
          lua5.4 game/tools/blender/sync_lua_metadata.lua \
            export-countries \
            game/assets/scripts/countries_latam.lua \
            /tmp/latam_countries.json

      - name: Paso Blender Python — Construir mapa 3D (.glb) y provinces_latam.lua desde GeoJSON
        run: |
          blender --background --python-exit-code 1 --python game/tools/blender/build_latam_map.py -- \
            --countries-json /tmp/latam_countries.json \
            --out-glb game/assets/maps/latinoamerica_3d.glb \
            --out-lua game/assets/scripts/provinces_latam.lua \
            --simplify-tol "${{ inputs.simplify_tolerance }}"

      - name: Paso Lua 5.4 — Validar sintaxis e integridad de provinces_latam.lua
        run: |
          lua5.4 game/tools/blender/sync_lua_metadata.lua \
            validate-provinces \
            game/assets/scripts/provinces_latam.lua

      - name: Subir mapa 3D (.glb) y provincias (.lua) como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: latam-3d-blender-assets
          path: |
            game/assets/maps/latinoamerica_3d.glb
            game/assets/scripts/provinces_latam.lua

      - name: Publicar mapa 3D y provincias en GitHub Release (opcional)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_version }}
        run: |
          RELEASE_TAG="$(echo "$RELEASE_TAG" | xargs)"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Error: Debes especificar una versión/tag en release_version si activas publish_release." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Actualizando assets del Release existente: $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" \
              game/assets/maps/latinoamerica_3d.glb \
              game/assets/scripts/provinces_latam.lua \
              --clobber
          else
            echo "Creando nuevo Release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              game/assets/maps/latinoamerica_3d.glb \
              game/assets/scripts/provinces_latam.lua \
              --title "Mapa 3D Latinoamérica ($RELEASE_TAG)" \
              --notes "Assets cartográficos 3D generados con Blender + Natural Earth (latinoamerica_3d.glb y provinces_latam.lua)."
          fi

      - name: Guardar cambios en el repositorio (solo si se activó manualmente)
        if: ${{ inputs.commit_assets }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f game/assets/maps/latinoamerica_3d.glb game/assets/scripts/provinces_latam.lua
          git diff --cached --quiet || git commit -m "Generar mapa 3D Blender (.glb) y provincias en Lua 5.4"
          git push
