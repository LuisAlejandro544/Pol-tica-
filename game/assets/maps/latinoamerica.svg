      d="M 556 702 L 574 732 L 614 736 L 606 774 L 636 806 L 672 802 L 676 864 L 682 900 L 668 946 L 632 982 L 606 1040 L 586 1106 L 558 1138 L 546 1132 L 558 1094 L 542 1018 L 548 920 L 558 836 L 562 762 Z" />
  </g>
</svg>
