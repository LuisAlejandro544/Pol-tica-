      d="M 332 266 L 347 265 L 348 292 L 333 292 Z" />

    <!-- Guatemala -->
    <path id="GT" data-name="Guatemala" fill="#2b6cb0"
      d="M 302 266 L 326 270 L 333 266 L 333 292 L 338 308 L 312 315 L 296 300 Z" />

    <!-- El Salvador -->
    <path id="SV" data-name="El Salvador" fill="#4c51bf"
      d="M 312 315 L 338 308 L 348 318 L 322 325 Z" />

    <!-- Honduras -->
    <path id="HN" data-name="Honduras" fill="#2c7a7b"
      d="M 333 292 L 348 292 L 392 296 L 404 312 L 372 324 L 348 318 L 338 308 Z" />

    <!-- Nicaragua -->
    <path id="NI" data-name="Nicaragua" fill="#38a169"
