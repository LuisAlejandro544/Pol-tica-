<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mapa vectorial geopolítico de Latinoamérica (21 naciones).
  Cada país está definido como un elemento <path> con atributo id en formato ISO-3166 alpha-2
  y atributo data-name con el nombre en español. Este mismo archivo SVG sirve tanto para
  previsualización vectorial como para ser parseado y teselado en GPU por el motor Rust.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b" />
      <stop offset="50%" stop-color="#0f2840" />
      <stop offset="100%" stop-color="#091726" />
    </linearGradient>
    <pattern id="latlonGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1e4263" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Fondo oceánico y retícula cartográfica -->
  <rect id="OCEAN" x="0" y="0" width="1000" height="1200" fill="url(#oceanGrad)" />
  <rect id="GRID" x="0" y="0" width="1000" height="1200" fill="url(#latlonGrid)" />

  <!-- Capa de países de Latinoamérica -->
  <g id="latam-countries" stroke="#0d1b2a" stroke-width="1.8" stroke-linejoin="round">
    <!-- México -->
    <path id="MX" data-name="México" fill="#2f855a"
      d="M 65 82 L 138 78 L 210 92 L 246 135 L 254 176 L 235 206 L 242 232 L 278 242 L 325 224 L 348 225 L 352 252 L 326 270 L 302 266 L 272 280 L 242 276 L 204 252 L 154 226 L 122 192 L 106 154 L 84 128 L 76 168 L 64 146 L 56 112 Z" />

