# Propósito del archivo:
# Flujo automatizado de compilación APK en la nube (GitHub Actions) para que
# puedas generar el APK de 32 bits + 64 bits directamente desde tu teléfono sin PC.

name: Compilar APK Horizonte Latam (Rust + Lua 5.4)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17 y Android NDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Rust estable y targets Android 32/64-bit
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Compilar APK Release vía Gradle + cargo-ndk
        working-directory: game/android
        run: gradle assembleRelease

      - name: Subir APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: HorizonteLatam-universal-apk
          path: game/android/app/build/outputs/apk/release/*.apk
